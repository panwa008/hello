# Serves the built web app and proxies /api (REST + Socket.io WebSocket) to the API container.
# In production put TLS in front (Caddy / Cloudflare / a load balancer) — GPS, motion sensors and
# payment webhooks all require HTTPS.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 5173;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 8m;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "geolocation=(self), accelerometer=(self), gyroscope=(self), camera=(), microphone=()" always;

  location /api/socket.io/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 75s;
  }

  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
